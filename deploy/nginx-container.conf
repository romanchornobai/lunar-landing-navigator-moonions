server {
    listen 80;
    root /usr/share/nginx/html;
    gzip on;
    gzip_types text/css application/javascript application/json model/gltf-binary application/octet-stream;

    # Area search API (Server-Sent Events: no buffering, long requests).
    location /api/ {
        proxy_pass http://api:8000;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 600s;
    }

    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Single-page app routes (/vista-sitio/..., etc.).
    location / {
        try_files $uri $uri/ /index.html;
    }
}
